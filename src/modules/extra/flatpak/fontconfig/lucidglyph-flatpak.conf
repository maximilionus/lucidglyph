<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<fontconfig>
  <description>Load the lucidglyph configuration in flatpak sandbox</description>

  <!-- Pre-load original sandbox configuration -->
  <include>/etc/fonts/fonts.conf</include>

  <include ignore_missing="yes">/opt/lucidglyph/extra/flatpak/fontconfig/11-lucidglyph-grayscale.conf</include>
  <include ignore_missing="yes">/opt/lucidglyph/extra/flatpak/fontconfig/11-lucidglyph-hinting-slight.conf</include>
  <include ignore_missing="yes">/opt/lucidglyph/extra/flatpak/fontconfig/20-lucidglyph-embolden.conf</include>
  <include ignore_missing="yes">/opt/lucidglyph/extra/flatpak/fontconfig/70-lucidglyph-droid-sans.conf</include>
  <include ignore_missing="yes">/opt/lucidglyph/extra/flatpak/fontconfig/70-lucidglyph-icon-fonts-auto.conf</include>
  <include ignore_missing="yes">/opt/lucidglyph/extra/flatpak/fontconfig/70-lucidglyph-icon-fonts-manual.conf</include>
</fontconfig>
